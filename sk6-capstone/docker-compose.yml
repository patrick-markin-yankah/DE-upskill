services:
  postgres:
    image: postgres:16
    container_name: cloudhr-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres     # local learning container only — never reuse in real systems
      POSTGRES_DB: cloudhr
    ports:
      - "5435:5432"                   # Power BI connects to localhost:5435
    volumes:
      - cloudhr_pgdata:/var/lib/postgresql/data
      - ./data:/data:ro               # generated CSV files
      - ./sql:/sql:ro                 # SQL scripts

volumes:
  cloudhr_pgdata:
